<style>
    * {
        margin:0;
        padding:0;
        box-sizing:border-box;
        scroll-behavior: smooth;
    }

    .marquee {
        overflow:hidden;
        width:100%;
        display:flex;
    }

    .marquee-inner {
        display:flex;
        justify-content:flex-start;
        animation:marquee 30s linear infinite;
    }

    .marquee-track {
        display:flex;
        flex-shrink:0;
    }

    .black-box {
        width:220px;
        height:220px;
    }

    .marquee-item {
        width:220px;
        height:220px;
        flex-shrink:0;
        overflow:hidden;
    }

    .marquee-item img {
        width:220px;
        height:220px;
        object-fit:cover;
        object-position:center center;
        display:block;
    }

    .textbox {
        background:black;
    }

    .textbox p {
        color:white;
        line-height:220px;
        text-align:center;
        font-size:25pt;
    }

    @keyframes marquee {
            from {transform:translateX(0)}
            to {transform:translateX(-50%)}
        }

    .product-grid {
        display:grid;
        grid-template-columns: repeat(4, 1fr);
    }

    .product-item img {
        width:100%;
        aspect-ratio:3 / 4;
        object-fit:cover;
        object-position:center;
        display:block;
    }

    .tops-section{
        border:1px solid red;
    }
</style>
